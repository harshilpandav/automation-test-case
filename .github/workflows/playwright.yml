name: Playwright Tests

# Manual-only: this workflow does not run on push or pull request.
# Start it from the Actions tab with "Run workflow".
#
# To re-enable automatic runs, uncomment the push/pull_request triggers below.
on:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright suite
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # TestDino resolves commit metadata (author, message) from git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Do NOT pass --reporter here: a CLI --reporter flag replaces the whole
      # reporter list from playwright.config.ts and silently drops the
      # TestDino reporter, so no results would reach the dashboard.
      #
      # continue-on-error is set because this suite contains 15 deliberately
      # failing tests (TC-21..TC-35), so `playwright test` always exits
      # non-zero. Remove it once those tests are gone, otherwise real
      # regressions will not fail the build.
      - name: Run Playwright tests
        continue-on-error: true
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
