name: Playwright Tests

# Runs automatically on the TestRuns branch only; main stays manual.
# Any branch can still be started by hand from the Actions tab.
#
# The workflow_dispatch inputs below are what makes this workflow eligible
# for a dashboard-triggered re-run: TestDino only offers the "Re-run" button
# for a workflow that declares a `testdino_rerun_from` input, and it fills
# these in when you start a re-run from a run's page. Leave them empty for a
# normal manual run.
on:
  push:
    branches: [TestRuns]
  workflow_dispatch:
    inputs:
      testdino_rerun_from:
        description: 'TestDino run id to re-run from (test_run_...). Filled in by the dashboard.'
        required: false
        default: ''
      testdino_rerun_sha:
        description: 'Commit SHA to check out for a same-commit re-run. Filled in by the dashboard.'
        required: false
        default: ''
      testdino_rerun_scope:
        description: 'Which tests to re-run: failed, flaky, or failed-and-flaky'
        required: false
        default: 'failed'
      testdino_rerun_test_ids:
        description: 'Comma-separated Playwright test ids to re-run instead of the scope'
        required: false
        default: ''
      testdino_rerun_exclude_ids:
        description: 'Comma-separated Playwright test ids to drop from the scope'
        required: false
        default: ''

jobs:
  test:
    name: Run Playwright suite
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # A dashboard re-run in "this commit" mode supplies the source run's
          # SHA here, so the re-run executes the same code rather than the
          # branch tip. Empty for a normal run, which falls back to the ref
          # the workflow was triggered on.
          ref: ${{ inputs.testdino_rerun_sha || github.sha }}
          # TestDino resolves commit metadata (author, message) from git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only: the suite is pinned to the chromium project below,
      # so installing firefox would just slow the job down.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Do NOT pass --reporter here: a CLI --reporter flag replaces the whole
      # reporter list from playwright.config.ts and silently drops the
      # TestDino reporter, so no results would reach the dashboard.
      #
      # continue-on-error is set because these suites contain deliberately
      # failing tests (todo TC-21..TC-35, and the store "failing" blocks),
      # so `playwright test` always exits non-zero. Remove it once those
      # tests are gone, otherwise real regressions will not fail the build.
      #
      # With testdino_rerun_from set, the TestDino CLI asks the dashboard which
      # tests to re-run and hands Playwright the selection as --test-list, so
      # only those tests execute. Needs @testdino/playwright >= 2.7.0 and
      # Playwright >= 1.56. Without it, the whole suite runs as normal.
      - name: Run Playwright tests
        continue-on-error: true
        shell: bash
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TD_RERUN_FROM: ${{ inputs.testdino_rerun_from }}
          TD_RERUN_SCOPE: ${{ inputs.testdino_rerun_scope }}
          TD_RERUN_TEST_IDS: ${{ inputs.testdino_rerun_test_ids }}
          TD_RERUN_EXCLUDE_IDS: ${{ inputs.testdino_rerun_exclude_ids }}
        run: |
          args=()
          if [ -n "$TD_RERUN_FROM" ]; then
            args+=(--rerun "${TD_RERUN_SCOPE:-failed}" --from-run "$TD_RERUN_FROM")
            if [ -n "$TD_RERUN_TEST_IDS" ]; then
              args+=(--test-ids "$TD_RERUN_TEST_IDS")
            fi
            if [ -n "$TD_RERUN_EXCLUDE_IDS" ]; then
              args+=(--exclude-ids "$TD_RERUN_EXCLUDE_IDS")
            fi
          fi
          # Re-run flags go before --; everything after it is passed to
          # Playwright unchanged. With no run id the array is empty and this
          # is an ordinary full-suite run.
          npx tdpw test "${args[@]}" -- --project=chromium

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts (screenshots, videos, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
